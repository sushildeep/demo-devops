name: Push Docker Image to ECR

description: Load tested Docker image and push it to AWS ECR

inputs:
  aws-region:
    description: AWS Region
    required: false
    default: us-east-1

  service-name:
    description: Service name
    required: true

  image-tag:
    description: Docker image tag
    required: true

  ecr-repository:
    description: ECR repository name
    required: true

  aws-role-to-assume:
    description: AWS IAM role ARN
    required: true

runs:
  using: composite

  steps:

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Verify AWS identity
      shell: bash
      run: |
        set -e

        echo "=========================================="
        echo "AWS Identity"
        echo "=========================================="

        aws sts get-caller-identity

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Load Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
      run: |
        set -e

        echo "=========================================="
        echo "Load Docker Image"
        echo "=========================================="

        IMAGE_FILE="docker-images/${SERVICE_NAME}.tar"

        if [ ! -f "$IMAGE_FILE" ]; then
          echo "ERROR: Docker image artifact not found:"
          echo "$IMAGE_FILE"
          exit 1
        fi

        echo "Loading:"
        echo "$IMAGE_FILE"

        docker load -i "$IMAGE_FILE"

        echo ""
        echo "Docker image loaded successfully."

        docker images "$SERVICE_NAME"

    - name: Verify Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -e

        echo "=========================================="
        echo "Verify Docker Image"
        echo "=========================================="

        IMAGE_NAME="${SERVICE_NAME}:${IMAGE_TAG}"

        echo "Expected image:"
        echo "$IMAGE_NAME"

        docker image inspect "$IMAGE_NAME" > /dev/null

        echo ""
        echo "Image verification successful."

    - name: Tag image for ECR
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -e

        echo "=========================================="
        echo "Tag Docker Image for ECR"
        echo "=========================================="

        SOURCE_IMAGE="${SERVICE_NAME}:${IMAGE_TAG}"

        ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SERVICE_NAME}-${IMAGE_TAG}"

        echo "Source:"
        echo "$SOURCE_IMAGE"

        echo ""
        echo "ECR:"
        echo "$ECR_IMAGE"

        docker tag \
          "$SOURCE_IMAGE" \
          "$ECR_IMAGE"

        echo ""
        echo "ECR image created successfully."

        docker images "$ECR_REGISTRY/$ECR_REPOSITORY"

    - name: Push image to ECR
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -e

        echo "=========================================="
        echo "Push Docker Image to ECR"
        echo "=========================================="

        ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SERVICE_NAME}-${IMAGE_TAG}"

        echo "Pushing:"
        echo "$ECR_IMAGE"

        docker push "$ECR_IMAGE"

        echo ""
        echo "=========================================="
        echo "ECR Push Successful"
        echo "=========================================="

        echo "Repository : $ECR_REPOSITORY"
        echo "Service    : $SERVICE_NAME"
        echo "Image Tag  : $IMAGE_TAG"

        echo ""
        echo "Image:"
        echo "$ECR_IMAGE"