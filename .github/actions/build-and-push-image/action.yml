name: Build and Push Docker Image to ECR
description: Build Docker image and push it to AWS ECR using GitHub OIDC

inputs:
  aws-region:
    description: AWS Region
    required: false
    default: us-east-1

  service-name:
    description: Service name
    required: true

  dockerfile-path:
    description: Path to Dockerfile directory
    required: true

  image-tag:
    description: Docker image tag
    required: true

  aws-role-to-assume:
    description: AWS IAM role ARN to assume using GitHub OIDC
    required: true

  environment-tag:
    description: Environment image tag
    required: false
    default: latest

  ecr-repository:
    description: ECR repository name
    required: true

outputs:
  image-uri:
    description: Full Docker image URI
    value: ${{ steps.build-push.outputs.image-uri }}

  image-tag:
    description: Docker image tag
    value: ${{ steps.build-push.outputs.image-tag }}

runs:
  using: composite

  steps:

    # ------------------------------------------------------------
    # Checkout
    # ------------------------------------------------------------

    - name: Checkout code
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # AWS OIDC
    # ------------------------------------------------------------

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    # ------------------------------------------------------------
    # Verify AWS
    # ------------------------------------------------------------

    - name: Verify AWS identity
      shell: bash
      run: |
        echo "AWS Identity:"
        aws sts get-caller-identity

    # ------------------------------------------------------------
    # ECR Login
    # ------------------------------------------------------------

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # ------------------------------------------------------------
    # Build and Push
    # ------------------------------------------------------------

    - name: Build and push Docker image
      id: build-push
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ENV_TAG: ${{ inputs.environment-tag }}
      run: |
        set -e

        IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY/$SERVICE_NAME"

        echo "=========================================="
        echo "Building Docker Image"
        echo "=========================================="
        echo "Service      : $SERVICE_NAME"
        echo "Repository   : $ECR_REPOSITORY"
        echo "Image Tag    : $IMAGE_TAG"
        echo "Environment  : $ENV_TAG"
        echo "Registry     : $ECR_REGISTRY"
        echo ""

        docker build \
          -t "$IMAGE_URI:$SERVICE_NAME" \
          -t "$IMAGE_URI:$SERVICE_NAME-$IMAGE_TAG" \
          -t "$IMAGE_URI:$SERVICE_NAME-$ENV_TAG" \
          "${{ inputs.dockerfile-path }}"

        echo ""
        echo "Pushing images..."

        docker push "$IMAGE_URI:$SERVICE_NAME"
        docker push "$IMAGE_URI:$SERVICE_NAME-$IMAGE_TAG"
        docker push "$IMAGE_URI:$SERVICE_NAME-$ENV_TAG"

        echo ""
        echo "=========================================="
        echo "Docker image pushed successfully"
        echo "=========================================="

        echo "image-uri=$IMAGE_URI:$SERVICE_NAME" >> "$GITHUB_OUTPUT"
        echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

        echo ""
        echo "Image URI:"
        echo "$IMAGE_URI:$SERVICE_NAME"

        echo ""
        echo "Tags:"
        echo "$SERVICE_NAME"
        echo "$SERVICE_NAME-$IMAGE_TAG"
        echo "$SERVICE_NAME-$ENV_TAG"

    # ------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------

    - name: Image summary
      shell: bash
      run: |
        echo "=========================================="
        echo "ECR Deployment Summary"
        echo "=========================================="
        echo "Image: ${{ steps.build-push.outputs.image-uri }}"
        echo "Tag:   ${{ steps.build-push.outputs.image-tag }}"
        echo "=========================================="