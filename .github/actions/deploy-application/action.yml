name: Deploy Application with Helm
description: Deploy microservices to EKS using Helm and GitHub OIDC

inputs:
  aws-region:
    description: AWS Region
    required: false
    default: us-east-1

  cluster-name:
    description: EKS cluster name
    required: true

  environment:
    description: Deployment environment
    required: true

  helm-chart-path:
    description: Helm chart path
    required: false
    default: ./helm

  helm-release-name:
    description: Helm release name
    required: false
    default: microservices-app

  helm-namespace:
    description: Kubernetes namespace
    required: false
    default: default

  helm-values-file:
    description: Helm values file
    required: true

  user-service-image-tag:
    description: User service image tag
    required: true

  order-service-image-tag:
    description: Order service image tag
    required: true

  aws-role-to-assume:
    description: AWS IAM role ARN for GitHub OIDC
    required: true

  helm-timeout:
    description: Helm deployment timeout
    required: false
    default: 10m

  wait-for-rollout:
    description: Wait for Kubernetes rollout
    required: false
    default: true

outputs:
  deployment-status:
    description: Deployment status
    value: ${{ steps.deploy.outputs.status }}

  helm-release-version:
    description: Helm release revision
    value: ${{ steps.deploy.outputs.release-version }}

runs:
  using: composite

  steps:

    # ------------------------------------------------------------
    # AWS OIDC
    # ------------------------------------------------------------

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    # ------------------------------------------------------------
    # Verify AWS
    # ------------------------------------------------------------

    - name: Verify AWS identity
      shell: bash
      run: |
        set -e

        echo "AWS identity:"
        aws sts get-caller-identity

    # ------------------------------------------------------------
    # Get AWS Account ID
    # ------------------------------------------------------------

    - name: Get AWS account ID
      id: aws-account
      shell: bash
      run: |
        set -e

        ACCOUNT_ID=$(aws sts get-caller-identity \
          --query Account \
          --output text)

        echo "AWS Account ID: $ACCOUNT_ID"
        echo "account-id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------
    # Configure Kubernetes
    # ------------------------------------------------------------

    - name: Configure kubectl
      shell: bash
      run: |
        set -e

        echo "Configuring kubeconfig..."
        echo "Environment: ${{ inputs.environment }}"
        echo "Cluster: ${{ inputs.cluster-name }}"

        aws eks update-kubeconfig \
          --region "${{ inputs.aws-region }}" \
          --name "${{ inputs.cluster-name }}"

        echo ""
        echo "Checking cluster access..."

        kubectl cluster-info
        kubectl get nodes

    # ------------------------------------------------------------
    # Setup Helm
    # ------------------------------------------------------------

    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: latest

    # ------------------------------------------------------------
    # Create namespace
    # ------------------------------------------------------------

    - name: Create namespace
      shell: bash
      run: |
        set -e

        kubectl create namespace "${{ inputs.helm-namespace }}" \
          --dry-run=client \
          -o yaml | \
          kubectl apply -f -

    # ------------------------------------------------------------
    # Validate Helm
    # ------------------------------------------------------------

    - name: Validate Helm chart
      shell: bash
      run: |
        set -e

        helm lint "${{ inputs.helm-chart-path }}"

    # ------------------------------------------------------------
    # Helm dry run
    # ------------------------------------------------------------

    - name: Helm dry run
      shell: bash
      run: |
        set -e

        ACCOUNT_ID="${{ steps.aws-account.outputs.account-id }}"

        helm upgrade --install \
          "${{ inputs.helm-release-name }}" \
          "${{ inputs.helm-chart-path }}" \
          --namespace "${{ inputs.helm-namespace }}" \
          --values "${{ inputs.helm-values-file }}" \
          --set image.registry="${ACCOUNT_ID}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com" \
          --set image.user_service.tag="${{ inputs.user-service-image-tag }}" \
          --set image.order_service.tag="${{ inputs.order-service-image-tag }}" \
          --timeout "${{ inputs.helm-timeout }}" \
          --dry-run \
          --debug \
          > /tmp/helm-dry-run.yaml

        echo "Helm dry run successful."

    # ------------------------------------------------------------
    # Deploy
    # ------------------------------------------------------------

    - name: Deploy with Helm
      id: deploy
      shell: bash
      run: |
        set -e

        ACCOUNT_ID="${{ steps.aws-account.outputs.account-id }}"

        echo "Deploying application..."
        echo "Environment: ${{ inputs.environment }}"
        echo "Cluster: ${{ inputs.cluster-name }}"

        HELM_ARGS=(
          upgrade
          --install
          "${{ inputs.helm-release-name }}"
          "${{ inputs.helm-chart-path }}"
          --namespace "${{ inputs.helm-namespace }}"
          --values "${{ inputs.helm-values-file }}"
          --set "image.registry=${ACCOUNT_ID}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          --set "image.user_service.tag=${{ inputs.user-service-image-tag }}"
          --set "image.order_service.tag=${{ inputs.order-service-image-tag }}"
          --timeout "${{ inputs.helm-timeout }}"
        )

        if [ "${{ inputs.wait-for-rollout }}" = "true" ]; then
          HELM_ARGS+=(--wait)
        fi

        helm "${HELM_ARGS[@]}"

        RELEASE_VERSION=$(helm list \
          -n "${{ inputs.helm-namespace }}" \
          -o json | \
          jq -r '.[] | select(.name=="${{ inputs.helm-release-name }}") | .revision')

        echo "status=success" >> "$GITHUB_OUTPUT"
        echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

        echo ""
        echo "Helm deployment successful."
        echo "Release: ${{ inputs.helm-release-name }}"
        echo "Revision: $RELEASE_VERSION"

    # ------------------------------------------------------------
    # Rollout verification
    # ------------------------------------------------------------

    - name: Verify rollout
      if: inputs.wait-for-rollout == 'true'
      shell: bash
      run: |
        set -e

        echo "Checking application rollouts..."

        kubectl rollout status \
          deployment/microservices-app-user-service \
          -n "${{ inputs.helm-namespace }}" \
          --timeout=5m

        kubectl rollout status \
          deployment/microservices-app-order-service \
          -n "${{ inputs.helm-namespace }}" \
          --timeout=5m

        echo "All deployments are healthy."

    # ------------------------------------------------------------
    # Deployment status
    # ------------------------------------------------------------

    - name: Deployment status
      shell: bash
      run: |
        echo "=========================================="
        echo "Deployment Summary"
        echo "=========================================="
        echo "Environment : ${{ inputs.environment }}"
        echo "Cluster     : ${{ inputs.cluster-name }}"
        echo "Release     : ${{ inputs.helm-release-name }}"
        echo "Namespace   : ${{ inputs.helm-namespace }}"
        echo "User image  : ${{ inputs.user-service-image-tag }}"
        echo "Order image : ${{ inputs.order-service-image-tag }}"
        echo ""

        echo "Pods:"
        kubectl get pods \
          -n "${{ inputs.helm-namespace }}"

        echo ""
        echo "Services:"
        kubectl get svc \
          -n "${{ inputs.helm-namespace }}"

    # ------------------------------------------------------------
    # Failure diagnostics
    # ------------------------------------------------------------

    - name: Collect failure diagnostics
      if: failure()
      shell: bash
      continue-on-error: true
      run: |
        echo "Deployment failed."
        echo ""

        echo "Pods:"
        kubectl get pods \
          -n "${{ inputs.helm-namespace }}" \
          -o wide || true

        echo ""
        echo "Recent events:"
        kubectl get events \
          -n "${{ inputs.helm-namespace }}" \
          --sort-by='.lastTimestamp' || true

        echo ""
        echo "Pod logs:"

        for POD in $(kubectl get pods \
          -n "${{ inputs.helm-namespace }}" \
          -o name); do

          echo "=========================================="
          echo "$POD"
          echo "=========================================="

          kubectl logs "$POD" \
            -n "${{ inputs.helm-namespace }}" \
            --tail=50 || true
        done

    # ------------------------------------------------------------
    # Upload Helm manifest
    # ------------------------------------------------------------

    - name: Upload Helm manifest
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: helm-manifest-${{ inputs.environment }}
        path: /tmp/helm-dry-run.yaml
        if-no-files-found: ignore
        retention-days: 7