name: Build Docker Image

description: Build and save a Docker image for a service

inputs:

  service-name:
    description: "Service name"
    required: true

  dockerfile-path:
    description: "Path to Dockerfile"
    required: true

  image-tag:
    description: "Docker image tag"
    required: true

  environment:
    description: "Deployment environment"
    required: false
    default: dev


runs:
  using: composite

  steps:

    - name: Prepare build
      shell: bash
      run: |
        set -e

        echo "=========================================="
        echo "Build Docker Image"
        echo "=========================================="

        echo "Service      : ${{ inputs.service-name }}"
        echo "Dockerfile   : ${{ inputs.dockerfile-path }}"
        echo "Image tag    : ${{ inputs.image-tag }}"
        echo "Environment  : ${{ inputs.environment }}"

        docker --version


    - name: Build Docker image
      shell: bash
      run: |
        set -e

        SERVICE_NAME="${{ inputs.service-name }}"
        DOCKERFILE_PATH="${{ inputs.dockerfile-path }}"
        IMAGE_TAG="${{ inputs.image-tag }}"

        IMAGE_NAME="${SERVICE_NAME}:${IMAGE_TAG}"

        echo "=========================================="
        echo "Building ${IMAGE_NAME}"
        echo "=========================================="

        docker build \
          -f "${DOCKERFILE_PATH}/Dockerfile" \
          -t "${IMAGE_NAME}" \
          "${DOCKERFILE_PATH}"

        echo "Docker image built successfully."

        docker image inspect "${IMAGE_NAME}" > /dev/null

        echo "Image verified:"
        docker images "${SERVICE_NAME}"


    - name: Save Docker image
      shell: bash
      run: |
        set -e

        SERVICE_NAME="${{ inputs.service-name }}"
        IMAGE_TAG="${{ inputs.image-tag }}"

        IMAGE_NAME="${SERVICE_NAME}:${IMAGE_TAG}"

        mkdir -p docker-images

        docker save \
          -o "docker-images/${SERVICE_NAME}.tar" \
          "${IMAGE_NAME}"

        echo "=========================================="
        echo "Docker image saved"
        echo "=========================================="

        ls -lh "docker-images/${SERVICE_NAME}.tar"