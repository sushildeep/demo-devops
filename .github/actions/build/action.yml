name: Build Docker Image

description: Build Docker image and save it as an artifact

inputs:

  service-name:
    description: Service name
    required: true

  dockerfile-path:
    description: Path to Dockerfile directory
    required: true

  image-tag:
    description: Docker image tag
    required: true

  environment:
    description: Build environment
    required: false
    default: dev

runs:
  using: composite

  steps:

    # ==========================================================
    # Build Docker Image
    # ==========================================================

    - name: Build Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        BUILD_ENVIRONMENT: ${{ inputs.environment }}
        DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}

      run: |
        set -e

        echo "=========================================="
        echo "Build Docker Image"
        echo "=========================================="

        echo "Service     : $SERVICE_NAME"
        echo "Image Tag   : $IMAGE_TAG"
        echo "Environment : $BUILD_ENVIRONMENT"
        echo "Docker Path : $DOCKERFILE_PATH"
        echo ""

        IMAGE_NAME="${SERVICE_NAME}:${IMAGE_TAG}"

        echo "Building:"
        echo "  $IMAGE_NAME"
        echo ""

        docker build \
          -t "$IMAGE_NAME" \
          "$DOCKERFILE_PATH"

        echo ""
        echo "Docker build completed successfully."


    # ==========================================================
    # Verify Docker Image
    # ==========================================================

    - name: Verify Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}

      run: |
        set -e

        echo "=========================================="
        echo "Verify Docker Image"
        echo "=========================================="

        IMAGE_NAME="${SERVICE_NAME}:${IMAGE_TAG}"

        docker image inspect "$IMAGE_NAME" > /dev/null

        echo "Image exists:"
        echo "$IMAGE_NAME"

        echo ""
        docker images "$SERVICE_NAME"


    # ==========================================================
    # Save Docker Image
    #
    # The image is saved so that the exact same image can be
    # used by the Push ECR stage.
    # ==========================================================

    - name: Save Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}

      run: |
        set -e

        echo "=========================================="
        echo "Save Docker Image"
        echo "=========================================="

        mkdir -p docker-images

        IMAGE_NAME="${SERVICE_NAME}:${IMAGE_TAG}"
        IMAGE_FILE="docker-images/${SERVICE_NAME}.tar"

        echo "Saving:"
        echo "  $IMAGE_NAME"

        docker save \
          "$IMAGE_NAME" \
          -o "$IMAGE_FILE"

        echo ""
        echo "Docker image saved successfully:"
        ls -lh "$IMAGE_FILE"