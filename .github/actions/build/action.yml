name: Build Docker Image
description: Build Docker image and save it as an artifact

inputs:
  aws-region:
    description: AWS Region
    required: false
    default: us-east-1

  service-name:
    description: Service name
    required: true

  dockerfile-path:
    description: Path to Dockerfile directory
    required: true

  image-tag:
    description: Docker image tag
    required: true

  environment-tag:
    description: Environment tag
    required: false
    default: latest

runs:
  using: composite

  steps:

    - name: Build Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ENV_TAG: ${{ inputs.environment-tag }}
      run: |
        set -e

        IMAGE_NAME="${SERVICE_NAME}:${IMAGE_TAG}"

        echo "=========================================="
        echo "Building Docker Image"
        echo "=========================================="
        echo "Service     : $SERVICE_NAME"
        echo "Image Tag   : $IMAGE_TAG"
        echo "Environment : $ENV_TAG"
        echo ""

        docker build \
          -t "$IMAGE_NAME" \
          -t "${SERVICE_NAME}:${SERVICE_NAME}" \
          -t "${SERVICE_NAME}:${SERVICE_NAME}-${ENV_TAG}" \
          "${{ inputs.dockerfile-path }}"

        echo ""
        echo "Docker images created:"
        docker images "$SERVICE_NAME"

    - name: Save Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -e

        mkdir -p docker-images

        docker save \
          "${SERVICE_NAME}:${IMAGE_TAG}" \
          -o "docker-images/${SERVICE_NAME}.tar"

        echo "Saved:"
        ls -lh "docker-images/${SERVICE_NAME}.tar"