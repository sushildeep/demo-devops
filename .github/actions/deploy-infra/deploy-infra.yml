name: Deploy Infrastructure with Terraform

description: Manage AWS infrastructure using Terraform and GitHub OIDC

inputs:

  aws-region:
    description: AWS Region
    required: false
    default: us-east-1

  terraform-version:
    description: Terraform version
    required: false
    default: "1.5.0"

  environment:
    description: Environment name
    required: true

  terraform-dir:
    description: Terraform directory
    required: true
    default: terraform/environments

  tfvars-file:
    description: Terraform variables file
    required: true

  aws-role-to-assume:
    description: AWS IAM role ARN for GitHub OIDC
    required: true

  state-bucket:
    description: S3 bucket for Terraform state
    required: true

  state-key:
    description: S3 key for Terraform state
    required: true

  state-lock-table:
    description: DynamoDB table for Terraform state locking
    required: true

  action:
    description: Terraform action - plan, apply, or destroy
    required: false
    default: plan


outputs:

  plan-exists:
    description: Whether Terraform plan contains changes
    value: ${{ steps.plan.outputs.plan-exists }}

  operation-summary:
    description: Terraform operation summary
    value: ${{ steps.apply.outputs.summary || steps.destroy.outputs.summary }}


runs:
  using: composite

  steps:

    # ==========================================================
    # AWS OIDC
    # ==========================================================

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}


    # ==========================================================
    # Verify AWS
    # ==========================================================

    - name: Verify AWS identity
      shell: bash
      run: |
        set -e

        echo "=========================================="
        echo "AWS Identity"
        echo "=========================================="

        aws sts get-caller-identity


    # ==========================================================
    # Setup Terraform
    # ==========================================================

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}


    # ==========================================================
    # Terraform Format
    # ==========================================================

    - name: Terraform Format Check
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set -e

        echo "=========================================="
        echo "Terraform Format Check"
        echo "=========================================="

        terraform fmt -check -recursive

        echo ""
        echo "Terraform format check passed."


    # ==========================================================
    # Terraform Init
    # ==========================================================

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set -e

        echo "=========================================="
        echo "Terraform Init"
        echo "=========================================="

        terraform init \
          -backend-config="bucket=${{ inputs.state-bucket }}" \
          -backend-config="key=${{ inputs.state-key }}" \
          -backend-config="region=${{ inputs.aws-region }}" \
          -backend-config="encrypt=true" \
          -backend-config="dynamodb_table=${{ inputs.state-lock-table }}"

        echo ""
        echo "Terraform initialized successfully."


    # ==========================================================
    # Terraform Validate
    # ==========================================================

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set -e

        echo "=========================================="
        echo "Terraform Validate"
        echo "=========================================="

        terraform validate

        echo ""
        echo "Terraform validation passed."


    # ==========================================================
    # Terraform Plan
    #
    # Runs ONLY when action = plan
    # ==========================================================

    - name: Terraform Plan
      id: plan
      if: inputs.action == 'plan'
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set +e

        echo "=========================================="
        echo "Terraform Plan"
        echo "=========================================="

        echo "Environment : ${{ inputs.environment }}"
        echo "Action      : plan"
        echo ""

        terraform plan \
          -var-file="${{ inputs.tfvars-file }}" \
          -out=tfplan \
          -detailed-exitcode

        EXIT_CODE=$?

        if [ "$EXIT_CODE" -eq 0 ]; then

          echo ""
          echo "No infrastructure changes."

          echo "plan-exists=false" >> "$GITHUB_OUTPUT"

        elif [ "$EXIT_CODE" -eq 2 ]; then

          echo ""
          echo "Infrastructure changes detected."

          echo "plan-exists=true" >> "$GITHUB_OUTPUT"

        else

          echo ""
          echo "Terraform plan failed."

          exit "$EXIT_CODE"

        fi


    # ==========================================================
    # Upload Terraform Plan
    #
    # The workflow can download this plan in the
    # separate Terraform Apply job.
    # ==========================================================

    - name: Upload Terraform Plan
      if: inputs.action == 'plan'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ inputs.environment }}
        path: ${{ inputs.terraform-dir }}/${{ inputs.environment }}/tfplan
        if-no-files-found: ignore
        retention-days: 7


    # ==========================================================
    # Verify Terraform Plan
    #
    # Runs ONLY when action = apply
    # ==========================================================

    - name: Verify Terraform Plan
      if: inputs.action == 'apply'
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set -e

        echo "=========================================="
        echo "Verify Terraform Plan"
        echo "=========================================="

        if [ ! -f tfplan ]; then
          echo "ERROR: Terraform plan file was not found."
          echo ""
          echo "Expected:"
          echo "${{ inputs.terraform-dir }}/${{ inputs.environment }}/tfplan"
          exit 1
        fi

        echo "Terraform plan found:"
        ls -lh tfplan


    # ==========================================================
    # Terraform Apply
    #
    # Runs ONLY when action = apply
    #
    # GitHub Environment approval is handled by ci.yml.
    # ==========================================================

    - name: Terraform Apply
      id: apply
      if: inputs.action == 'apply'
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set -e

        echo "=========================================="
        echo "Terraform Apply"
        echo "=========================================="

        echo "Environment : ${{ inputs.environment }}"
        echo ""

        terraform apply \
          -auto-approve \
          -input=false \
          tfplan

        echo ""
        echo "Terraform apply completed successfully."

        echo "summary=Terraform infrastructure deployed successfully" \
          >> "$GITHUB_OUTPUT"


    # ==========================================================
    # Terraform Outputs
    # ==========================================================

    - name: Terraform Outputs
      if: inputs.action == 'apply'
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set -e

        echo "=========================================="
        echo "Terraform Outputs"
        echo "=========================================="

        terraform output

        terraform output -json > terraform-outputs.json


    # ==========================================================
    # Upload Terraform Outputs
    # ==========================================================

    - name: Upload Terraform Outputs
      if: inputs.action == 'apply'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-outputs-${{ inputs.environment }}
        path: ${{ inputs.terraform-dir }}/${{ inputs.environment }}/terraform-outputs.json
        if-no-files-found: ignore
        retention-days: 30


    # ==========================================================
    # Terraform Destroy
    #
    # Kept for future/manual infrastructure destroy workflow.
    # ==========================================================

    - name: Terraform Destroy
      id: destroy
      if: inputs.action == 'destroy'
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}/${{ inputs.environment }}
      run: |
        set -e

        echo "=========================================="
        echo "WARNING: TERRAFORM DESTROY"
        echo "=========================================="

        echo "Environment: ${{ inputs.environment }}"
        echo ""

        terraform plan \
          -destroy \
          -var-file="${{ inputs.tfvars-file }}" \
          -out=destroy.tfplan

        echo ""
        echo "Destroy plan created."

        terraform apply \
          -auto-approve \
          -input=false \
          destroy.tfplan

        echo ""
        echo "Terraform destroy completed successfully."

        echo "summary=Terraform infrastructure destroyed successfully" \
          >> "$GITHUB_OUTPUT"


    # ==========================================================
    # Terraform Summary
    # ==========================================================

    - name: Terraform Summary
      if: always()
      shell: bash
      run: |
        echo "=========================================="
        echo "Terraform Summary"
        echo "=========================================="

        echo "Environment : ${{ inputs.environment }}"
        echo "Action      : ${{ inputs.action }}"
        echo "State Bucket: ${{ inputs.state-bucket }}"
        echo "State Key   : ${{ inputs.state-key }}"
        echo "Lock Table  : ${{ inputs.state-lock-table }}"

        echo "=========================================="