name: Push Docker Image to ECR
description: Load Docker image and push it to AWS ECR

inputs:
  aws-region:
    description: AWS Region
    required: false
    default: us-east-1

  service-name:
    description: Service name
    required: true

  image-tag:
    description: Docker image tag
    required: true

  environment-tag:
    description: Environment tag
    required: true

  ecr-repository:
    description: ECR repository name
    required: true

  aws-role-to-assume:
    description: AWS IAM role ARN
    required: true

runs:
  using: composite

  steps:

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Verify AWS identity
      shell: bash
      run: |
        set -e

        echo "AWS Identity:"
        aws sts get-caller-identity

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Load Docker image
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
      run: |
        set -e

        echo "Loading Docker image..."

        docker load \
          -i "docker-images/${SERVICE_NAME}.tar"

        echo ""
        echo "Loaded images:"
        docker images "$SERVICE_NAME"

    - name: Tag image for ECR
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ENV_TAG: ${{ inputs.environment-tag }}
      run: |
        set -e

        ECR_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

        echo "=========================================="
        echo "Tagging Docker Image"
        echo "=========================================="
        echo "Registry    : $ECR_REGISTRY"
        echo "Repository  : $ECR_REPOSITORY"
        echo "Service     : $SERVICE_NAME"
        echo "Image Tag   : $IMAGE_TAG"
        echo "Environment : $ENV_TAG"
        echo ""

        docker tag \
          "$SERVICE_NAME:$IMAGE_TAG" \
          "$ECR_IMAGE:$SERVICE_NAME"

        docker tag \
          "$SERVICE_NAME:$IMAGE_TAG" \
          "$ECR_IMAGE:$SERVICE_NAME-$IMAGE_TAG"

        docker tag \
          "$SERVICE_NAME:$IMAGE_TAG" \
          "$ECR_IMAGE:$SERVICE_NAME-$ENV_TAG"

        echo ""
        echo "ECR images:"
        docker images "$ECR_IMAGE"

    - name: Push image to ECR
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        SERVICE_NAME: ${{ inputs.service-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ENV_TAG: ${{ inputs.environment-tag }}
      run: |
        set -e

        ECR_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

        echo "=========================================="
        echo "Pushing Image to ECR"
        echo "=========================================="

        docker push "$ECR_IMAGE:$SERVICE_NAME"
        docker push "$ECR_IMAGE:$SERVICE_NAME-$IMAGE_TAG"
        docker push "$ECR_IMAGE:$SERVICE_NAME-$ENV_TAG"

        echo ""
        echo "=========================================="
        echo "ECR Push Successful"
        echo "=========================================="
        echo "Repository: $ECR_REPOSITORY"
        echo "Service   : $SERVICE_NAME"
        echo ""
        echo "Images:"
        echo "$ECR_IMAGE:$SERVICE_NAME"
        echo "$ECR_IMAGE:$SERVICE_NAME-$IMAGE_TAG"
        echo "$ECR_IMAGE:$SERVICE_NAME-$ENV_TAG"