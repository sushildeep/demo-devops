name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:

      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

      build_images:
        description: Build Docker images?
        required: true
        type: boolean
        default: true

      deploy_infrastructure:
        description: Deploy Terraform infrastructure?
        required: true
        type: boolean
        default: false

      terraform_action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      deploy_application:
        description: Deploy application to EKS?
        required: true
        type: boolean
        default: false

      user_service_tag:
        description: User service image tag
        required: false
        type: string

      order_service_tag:
        description: Order service image tag
        required: false
        type: string


env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.5.0"


jobs:

  # ==========================================================
  # 1. BUILD
  # ==========================================================

  build:
    name: Build Docker Images
    if: ${{ inputs.build_images }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build user-service
        uses: ./.github/actions/build-and-push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          dockerfile-path: ./services/user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          environment-tag: ${{ inputs.environment }}
          ecr-repository: ${{ inputs.environment }}

      - name: Build order-service
        uses: ./.github/actions/build-and-push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          dockerfile-path: ./services/order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          environment-tag: ${{ inputs.environment }}
          ecr-repository: ${{ inputs.environment }}


  # ==========================================================
  # 2. TERRAFORM PLAN
  # ==========================================================

  terraform-plan:
    name: Terraform Plan
    if: ${{ inputs.deploy_infrastructure }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Plan
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ inputs.environment }}
          terraform-dir: terraform/environments
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          state-key: microservices/${{ inputs.environment }}/terraform.tfstate
          state-lock-table: ${{ vars.TERRAFORM_LOCK_TABLE }}
          action: plan


  # ==========================================================
  # 3. APPROVAL + TERRAFORM APPLY
  # ==========================================================

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: ${{ inputs.deploy_infrastructure && inputs.terraform_action == 'apply' }}
    runs-on: ubuntu-latest

    # Approval comes from the selected GitHub Environment.
    # Configure required reviewers on BOTH dev and prod.
    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Apply
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ inputs.environment }}
          terraform-dir: terraform/environments
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          state-key: microservices/${{ inputs.environment }}/terraform.tfstate
          state-lock-table: ${{ vars.TERRAFORM_LOCK_TABLE }}
          action: apply


  # ==========================================================
  # 4. DEPLOY APPLICATION
  # ==========================================================

  deploy:
    name: Deploy Application
    needs:
      - build
      - terraform-apply

    if: >-
      ${{ inputs.deploy_application &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EKS
        uses: ./.github/actions/deploy-application
        with:
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: ${{ inputs.environment == 'prod' && 'microservices-prod-eks' || 'microservices-dev-eks' }}
          environment: ${{ inputs.environment }}
          helm-chart-path: ./helm
          helm-release-name: microservices-app
          helm-namespace: default
          helm-values-file: ${{ inputs.environment == 'prod' && 'helm/values-prod.yaml' || 'helm/values-dev.yaml' }}
          user-service-image-tag: ${{ inputs.user_service_tag || github.sha }}
          order-service-image-tag: ${{ inputs.order_service_tag || github.sha }}
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          helm-timeout: 10m
          wait-for-rollout: true
