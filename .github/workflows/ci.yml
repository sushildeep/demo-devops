name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:

      # ==========================================================
      # Deployment Environment
      # ==========================================================

      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

      # ==========================================================
      # Build
      # ==========================================================

      build_images:
        description: Build Docker images?
        required: true
        type: boolean
        default: true

      # ==========================================================
      # Infrastructure
      # ==========================================================

      deploy_infrastructure:
        description: Deploy Terraform infrastructure?
        required: true
        type: boolean
        default: false

      terraform_action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      # ==========================================================
      # Application
      # ==========================================================

      deploy_application:
        description: Deploy application to EKS?
        required: true
        type: boolean
        default: false

      # ==========================================================
      # Image Tags
      # ==========================================================

      user_service_tag:
        description: User service image tag
        required: false
        type: string

      order_service_tag:
        description: Order service image tag
        required: false
        type: string


# ==============================================================
# GLOBAL ENVIRONMENT
# ==============================================================

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.5.0"


jobs:

  # ============================================================
  # 1. BUILD
  #
  # NO APPROVAL
  # NO AWS
  # NO GITHUB ENVIRONMENT
  #
  # Build images and save them as GitHub artifacts.
  # ============================================================

  build:
    name: Build Docker Images

    if: ${{ inputs.build_images }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Build User Service
      # --------------------------------------------------------

      - name: Build user-service
        uses: ./.github/actions/build
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          dockerfile-path: ./services/user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          environment-tag: ${{ inputs.environment }}


      # --------------------------------------------------------
      # Build Order Service
      # --------------------------------------------------------

      - name: Build order-service
        uses: ./.github/actions/build
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          dockerfile-path: ./services/order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          environment-tag: ${{ inputs.environment }}


      # --------------------------------------------------------
      # Upload Docker Images
      # --------------------------------------------------------

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images/
          retention-days: 1


  # ============================================================
  # 2. PUSH DEV ECR
  #
  # NO APPROVAL
  # NO ENVIRONMENT
  #
  # ECR repository:
  #   dev
  #
  # Images:
  #   dev:user-service
  #   dev:order-service
  # ============================================================

  push-dev:
    name: Push Images - DEV

    needs:
      - build

    if: >-
      ${{ inputs.environment == 'dev' &&
      inputs.build_images &&
      needs.build.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # Download Images
      # --------------------------------------------------------

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images


      # --------------------------------------------------------
      # Push User Service
      # --------------------------------------------------------

      - name: Push user-service to DEV ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          environment-tag: dev
          ecr-repository: dev
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


      # --------------------------------------------------------
      # Push Order Service
      # --------------------------------------------------------

      - name: Push order-service to DEV ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          environment-tag: dev
          ecr-repository: dev
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


  # ============================================================
  # 3. PUSH PROD ECR
  #
  # PROD APPROVAL REQUIRED
  #
  # This is intentionally a separate job because GitHub
  # Environment approval happens at JOB level.
  #
  # ECR repository:
  #   prod
  # ============================================================

  push-prod:
    name: Push Images - PROD

    needs:
      - build

    if: >-
      ${{ inputs.environment == 'prod' &&
      inputs.build_images &&
      needs.build.result == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: prod

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # Download Images
      # --------------------------------------------------------

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images


      # --------------------------------------------------------
      # Push User Service
      # --------------------------------------------------------

      - name: Push user-service to PROD ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          environment-tag: prod
          ecr-repository: prod
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


      # --------------------------------------------------------
      # Push Order Service
      # --------------------------------------------------------

      - name: Push order-service to PROD ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          environment-tag: prod
          ecr-repository: prod
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


  # ============================================================
  # 4. TERRAFORM PLAN
  #
  # NO APPROVAL
  # NO GITHUB ENVIRONMENT
  # ============================================================

  terraform-plan:
    name: Terraform Plan

    if: ${{ inputs.deploy_infrastructure }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ inputs.environment }}
          terraform-dir: terraform/environments
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          state-key: microservices/${{ inputs.environment }}/terraform.tfstate
          state-lock-table: ${{ vars.TERRAFORM_LOCK_TABLE }}
          action: plan


  # ============================================================
  # 5. TERRAFORM APPLY
  #
  # APPROVAL REQUIRED
  #
  # DEV  -> dev approval
  # PROD -> prod approval
  # ============================================================

  terraform-apply:
    name: Terraform Apply

    needs:
      - terraform-plan

    if: >-
      ${{ inputs.deploy_infrastructure &&
      inputs.terraform_action == 'apply' &&
      needs.terraform-plan.result == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ inputs.environment }}
          terraform-dir: terraform/environments
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          state-key: microservices/${{ inputs.environment }}/terraform.tfstate
          state-lock-table: ${{ vars.TERRAFORM_LOCK_TABLE }}
          action: apply


  # ============================================================
  # 6. DEPLOY DEV
  #
  # NO APPROVAL
  #
  # IMPORTANT:
  # There is NO environment: dev here.
  # ============================================================

  deploy-dev:
    name: Deploy Application - DEV

    needs:
      - build
      - push-dev
      - terraform-apply

    if: >-
      ${{ inputs.environment == 'dev' &&
      inputs.deploy_application &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.push-dev.result == 'success' || needs.push-dev.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Deploy to DEV EKS
        uses: ./.github/actions/deploy-application
        with:
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: microservices-dev-eks
          environment: dev
          helm-chart-path: ./helm
          helm-release-name: microservices-app
          helm-namespace: default
          helm-values-file: helm/values-dev.yaml
          user-service-image-tag: ${{ inputs.user_service_tag || github.sha }}
          order-service-image-tag: ${{ inputs.order_service_tag || github.sha }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          helm-timeout: 10m
          wait-for-rollout: true


  # ============================================================
  # 7. DEPLOY PROD
  #
  # PROD APPROVAL REQUIRED
  # ============================================================

  deploy-prod:
    name: Deploy Application - PROD

    needs:
      - build
      - push-prod
      - terraform-apply

    if: >-
      ${{ inputs.environment == 'prod' &&
      inputs.deploy_application &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.push-prod.result == 'success' || needs.push-prod.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') }}

    runs-on: ubuntu-latest

    environment:
      name: prod

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Deploy to PROD EKS
        uses: ./.github/actions/deploy-application
        with:
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: microservices-prod-eks
          environment: prod
          helm-chart-path: ./helm
          helm-release-name: microservices-app
          helm-namespace: default
          helm-values-file: helm/values-prod.yaml
          user-service-image-tag: ${{ inputs.user_service_tag || github.sha }}
          order-service-image-tag: ${{ inputs.order_service_tag || github.sha }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          helm-timeout: 10m
          wait-for-rollout: true
