name: CI/CD Pipeline

on:
  workflow_dispatch:

# ============================================================
# GLOBAL CONFIGURATION
# ============================================================

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

  TERRAFORM_VERSION: "1.5.0"
  TERRAFORM_DIR: terraform/environments

  HELM_CHART_PATH: ./helm
  HELM_RELEASE_NAME: microservices-app
  HELM_NAMESPACE: default

  DEV_ECR_REPOSITORY: dev
  PROD_ECR_REPOSITORY: prod

  DEV_CLUSTER: microservices-dev-eks
  PROD_CLUSTER: microservices-prod-eks


jobs:

  # ==========================================================
  # 1. VALIDATE
  # ==========================================================

  validate:

    name: Validate Repository

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        uses: ./.github/actions/validate
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terraform-dir: ${{ env.TERRAFORM_DIR }}


  # ==========================================================
  # 2. BUILD
  #
  # Build only ONCE.
  # ==========================================================

  build:

    name: Build Docker Images

    needs:
      - validate

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build user-service
        uses: ./.github/actions/build
        with:
          service-name: user-service
          dockerfile-path: ./services/user-service
          image-tag: ${{ github.sha }}
          environment: dev

      - name: Build order-service
        uses: ./.github/actions/build
        with:
          service-name: order-service
          dockerfile-path: ./services/order-service
          image-tag: ${{ github.sha }}
          environment: dev

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images/
          retention-days: 7


  # ==========================================================
  # 3. TEST
  # ==========================================================

  test:

    name: Test Application

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images

      - name: Load user-service image
        shell: bash
        run: |
          set -e
          docker load -i docker-images/user-service.tar

      - name: Load order-service image
        shell: bash
        run: |
          set -e
          docker load -i docker-images/order-service.tar

      - name: Run application tests
        uses: ./.github/actions/test
        with:
          user-service-image: user-service:${{ github.sha }}
          order-service-image: order-service:${{ github.sha }}


  # ==========================================================
  # 4. PUSH TESTED IMAGES TO DEV ECR
  # ==========================================================

  push-dev:

    name: Push Images - DEV

    needs:
      - test

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images

      - name: Push user-service to DEV ECR
        uses: ./.github/actions/push
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          service-name: user-service
          image-tag: ${{ github.sha }}
          ecr-repository: ${{ env.DEV_ECR_REPOSITORY }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Push order-service to DEV ECR
        uses: ./.github/actions/push
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          service-name: order-service
          image-tag: ${{ github.sha }}
          ecr-repository: ${{ env.DEV_ECR_REPOSITORY }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


  # ==========================================================
  # 5. TERRAFORM PLAN - DEV
  #
  # NO APPROVAL
  # ==========================================================

  terraform-plan-dev:

    name: Terraform Plan - DEV

    needs:
      - push-dev

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Plan - DEV
        uses: ./.github/actions/deploy-infra
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: dev
          terraform-dir: ${{ env.TERRAFORM_DIR }}
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ secrets.DEV_TERRAFORM_STATE_BUCKET }}
          state-key: microservices/dev/terraform.tfstate
          state-lock-table: ${{ secrets.TERRAFORM_LOCK_TABLE }}
          action: plan


  # ==========================================================
  # 6. TERRAFORM APPLY - DEV
  #
  # DEV APPROVAL
  # ==========================================================

  terraform-apply-dev:

    name: Terraform Apply - DEV

    needs:
      - terraform-plan-dev

    runs-on: ubuntu-latest

    environment:
      name: dev

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DEV Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-dev
          path: ${{ env.TERRAFORM_DIR }}/dev

      - name: Terraform Apply - DEV
        uses: ./.github/actions/deploy-infra
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: dev
          terraform-dir: ${{ env.TERRAFORM_DIR }}
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ secrets.DEV_TERRAFORM_STATE_BUCKET }}
          state-key: microservices/dev/terraform.tfstate
          state-lock-table: ${{ secrets.TERRAFORM_LOCK_TABLE }}
          action: apply


  # ==========================================================
  # 7. DEPLOY APPLICATION - DEV
  #
  # No additional approval.
  # ==========================================================

  deploy-dev:

    name: Deploy Application - DEV

    needs:
      - terraform-apply-dev

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to DEV EKS
        uses: ./.github/actions/deploy-app
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          cluster-name: ${{ env.DEV_CLUSTER }}
          environment: dev
          helm-chart-path: ${{ env.HELM_CHART_PATH }}
          helm-release-name: ${{ env.HELM_RELEASE_NAME }}
          helm-namespace: ${{ env.HELM_NAMESPACE }}
          helm-values-file: helm/values-dev.yaml
          user-service-image-tag: ${{ github.sha }}
          order-service-image-tag: ${{ github.sha }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          helm-timeout: 10m
          wait-for-rollout: true


  # ==========================================================
  # 8. DEV SMOKE TEST
  # ==========================================================

  smoke-test-dev:

    name: Smoke Test - DEV

    needs:
      - deploy-dev

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        shell: bash
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${DEV_CLUSTER}"

      - name: Smoke test DEV
        shell: bash
        run: |
          set -e

          kubectl cluster-info

          kubectl get pods \
            --namespace "${HELM_NAMESPACE}" \
            -o wide

          kubectl rollout status \
            deployment/user-service \
            --namespace "${HELM_NAMESPACE}" \
            --timeout=10m

          kubectl rollout status \
            deployment/order-service \
            --namespace "${HELM_NAMESPACE}" \
            --timeout=10m

          echo "DEV smoke test passed."


  # ==========================================================
  # 9. TERRAFORM PLAN - PROD
  #
  # NO APPROVAL
  #
  # Only runs after DEV smoke test succeeds.
  # ==========================================================

  terraform-plan-prod:

    name: Terraform Plan - PROD

    needs:
      - smoke-test-dev

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Plan - PROD
        uses: ./.github/actions/deploy-infra
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: prod
          terraform-dir: ${{ env.TERRAFORM_DIR }}
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ secrets.PROD_TERRAFORM_STATE_BUCKET }}
          state-key: microservices/prod/terraform.tfstate
          state-lock-table: ${{ secrets.TERRAFORM_LOCK_TABLE }}
          action: plan


  # ==========================================================
  # 10. TERRAFORM APPLY - PROD
  #
  # prod-infra APPROVAL
  # ==========================================================

  terraform-apply-prod:

    name: Terraform Apply - PROD

    needs:
      - terraform-plan-prod

    runs-on: ubuntu-latest

    environment:
      name: prod-infra

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PROD Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod
          path: ${{ env.TERRAFORM_DIR }}/prod

      - name: Terraform Apply - PROD
        uses: ./.github/actions/deploy-infra
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: prod
          terraform-dir: ${{ env.TERRAFORM_DIR }}
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ secrets.PROD_TERRAFORM_STATE_BUCKET }}
          state-key: microservices/prod/terraform.tfstate
          state-lock-table: ${{ secrets.TERRAFORM_LOCK_TABLE }}
          action: apply


  # ==========================================================
  # 11. PROMOTE SAME TESTED IMAGES TO PROD ECR
  #
  # NO BUILD HERE.
  # ==========================================================

  promote-prod:

    name: Promote Images - PROD

    needs:
      - terraform-apply-prod

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tested Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images

      - name: Push user-service to PROD ECR
        uses: ./.github/actions/push
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          service-name: user-service
          image-tag: ${{ github.sha }}
          ecr-repository: ${{ env.PROD_ECR_REPOSITORY }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Push order-service to PROD ECR
        uses: ./.github/actions/push
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          service-name: order-service
          image-tag: ${{ github.sha }}
          ecr-repository: ${{ env.PROD_ECR_REPOSITORY }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


  # ==========================================================
  # 12. DEPLOY APPLICATION - PROD
  #
  # prod-app APPROVAL
  # ==========================================================

  deploy-prod:

    name: Deploy Application - PROD

    needs:
      - promote-prod

    runs-on: ubuntu-latest

    environment:
      name: prod-app

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to PROD EKS
        uses: ./.github/actions/deploy-app
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          cluster-name: ${{ env.PROD_CLUSTER }}
          environment: prod
          helm-chart-path: ${{ env.HELM_CHART_PATH }}
          helm-release-name: ${{ env.HELM_RELEASE_NAME }}
          helm-namespace: ${{ env.HELM_NAMESPACE }}
          helm-values-file: helm/values-prod.yaml
          user-service-image-tag: ${{ github.sha }}
          order-service-image-tag: ${{ github.sha }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          helm-timeout: 10m
          wait-for-rollout: true


  # ==========================================================
  # 13. PROD SMOKE TEST
  # ==========================================================

  smoke-test-prod:

    name: Smoke Test - PROD

    needs:
      - deploy-prod

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        shell: bash
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${PROD_CLUSTER}"

      - name: Smoke test PROD
        shell: bash
        run: |
          set -e

          kubectl cluster-info

          kubectl get pods \
            --namespace "${HELM_NAMESPACE}" \
            -o wide

          kubectl rollout status \
            deployment/user-service \
            --namespace "${HELM_NAMESPACE}" \
            --timeout=10m

          kubectl rollout status \
            deployment/order-service \
            --namespace "${HELM_NAMESPACE}" \
            --timeout=10m

          echo "PROD smoke test passed."


  # ==========================================================
  # 14. SUMMARY
  # ==========================================================

  summary:

    name: Pipeline Summary

    needs:
      - validate
      - build
      - test
      - push-dev
      - terraform-plan-dev
      - terraform-apply-dev
      - deploy-dev
      - smoke-test-dev
      - terraform-plan-prod
      - terraform-apply-prod
      - promote-prod
      - deploy-prod
      - smoke-test-prod

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline summary
        shell: bash
        run: |
          echo "=========================================="
          echo "CI/CD PIPELINE SUMMARY"
          echo "=========================================="

          echo ""
          echo "Commit: ${{ github.sha }}"

          echo ""
          echo "DEV"
          echo "Validate        : ${{ needs.validate.result }}"
          echo "Build           : ${{ needs.build.result }}"
          echo "Test            : ${{ needs.test.result }}"
          echo "Push ECR        : ${{ needs.push-dev.result }}"
          echo "Terraform Plan  : ${{ needs.terraform-plan-dev.result }}"
          echo "Terraform Apply : ${{ needs.terraform-apply-dev.result }}"
          echo "Deploy          : ${{ needs.deploy-dev.result }}"
          echo "Smoke Test      : ${{ needs.smoke-test-dev.result }}"

          echo ""
          echo "PROD"
          echo "Terraform Plan  : ${{ needs.terraform-plan-prod.result }}"
          echo "Terraform Apply : ${{ needs.terraform-apply-prod.result }}"
          echo "Image Promote   : ${{ needs.promote-prod.result }}"
          echo "Deploy          : ${{ needs.deploy-prod.result }}"
          echo "Smoke Test      : ${{ needs.smoke-test-prod.result }}"

          echo ""
          echo "=========================================="