name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:

      # ==========================================================
      # Deployment Environment
      # ==========================================================

      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

      # ==========================================================
      # Build
      # ==========================================================

      build_images:
        description: Build Docker images?
        required: true
        type: boolean
        default: true

      # ==========================================================
      # Infrastructure
      # ==========================================================

      deploy_infrastructure:
        description: Deploy Terraform infrastructure?
        required: true
        type: boolean
        default: false

      terraform_action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

      # ==========================================================
      # Application
      # ==========================================================

      deploy_application:
        description: Deploy application to EKS?
        required: true
        type: boolean
        default: false

      # ==========================================================
      # Image Tags
      # ==========================================================

      user_service_tag:
        description: User service image tag
        required: false
        type: string

      order_service_tag:
        description: Order service image tag
        required: false
        type: string


# ==============================================================
# GLOBAL ENVIRONMENT
# ==============================================================

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.5.0"


jobs:

  # ============================================================
  # 1. BUILD DEV
  #
  # DEV:
  # Build → Push DEV
  #
  # NO APPROVAL
  # ============================================================

  build-dev:
    name: Build Docker Images - DEV

    if: >-
      ${{ inputs.environment == 'dev' &&
      inputs.build_images &&
      inputs.terraform_action != 'destroy' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Build user-service
      # --------------------------------------------------------

      - name: Build user-service
        uses: ./.github/actions/build
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          dockerfile-path: ./services/user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          environment-tag: dev


      # --------------------------------------------------------
      # Build order-service
      # --------------------------------------------------------

      - name: Build order-service
        uses: ./.github/actions/build
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          dockerfile-path: ./services/order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          environment-tag: dev


      # --------------------------------------------------------
      # Upload DEV images
      # --------------------------------------------------------

      - name: Upload DEV Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-dev-${{ github.sha }}
          path: docker-images/
          retention-days: 1


  # ============================================================
  # 2. PUSH DEV ECR
  #
  # NO APPROVAL
  #
  # ECR repository:
  #   dev
  # ============================================================

  push-dev:
    name: Push Images - DEV

    needs:
      - build-dev

    if: >-
      ${{ inputs.environment == 'dev' &&
      inputs.build_images &&
      inputs.terraform_action != 'destroy' &&
      needs.build-dev.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download DEV Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-dev-${{ github.sha }}
          path: docker-images


      # --------------------------------------------------------
      # Push user-service
      # --------------------------------------------------------

      - name: Push user-service to DEV ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          environment-tag: dev
          ecr-repository: dev
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


      # --------------------------------------------------------
      # Push order-service
      # --------------------------------------------------------

      - name: Push order-service to DEV ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          environment-tag: dev
          ecr-repository: dev
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


  # ============================================================
  # 3. BUILD PROD
  #
  # IMPORTANT:
  #
  # PROD approval happens BEFORE this job starts.
  #
  # Therefore:
  #
  # PROD Approval
  #      ↓
  # Build NEW PROD images
  #
  # This does NOT reuse DEV build artifacts.
  # ============================================================

  build-prod:
    name: Build Docker Images - PROD

    if: >-
      ${{ inputs.environment == 'prod' &&
      inputs.build_images &&
      inputs.terraform_action != 'destroy' }}

    runs-on: ubuntu-latest

    environment:
      name: prod

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Build NEW PROD user-service
      # --------------------------------------------------------

      - name: Build user-service
        uses: ./.github/actions/build
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          dockerfile-path: ./services/user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          environment-tag: prod


      # --------------------------------------------------------
      # Build NEW PROD order-service
      # --------------------------------------------------------

      - name: Build order-service
        uses: ./.github/actions/build
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          dockerfile-path: ./services/order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          environment-tag: prod


      # --------------------------------------------------------
      # Upload PROD images
      # --------------------------------------------------------

      - name: Upload PROD Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-prod-${{ github.sha }}
          path: docker-images/
          retention-days: 1


  # ============================================================
  # 4. PUSH PROD ECR
  #
  # NO environment HERE.
  #
  # Approval already happened in build-prod.
  #
  # This job only pushes the newly-built PROD images.
  # ============================================================

  push-prod:
    name: Push Images - PROD

    needs:
      - build-prod

    if: >-
      ${{ inputs.environment == 'prod' &&
      inputs.build_images &&
      inputs.terraform_action != 'destroy' &&
      needs.build-prod.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download PROD Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-prod-${{ github.sha }}
          path: docker-images


      # --------------------------------------------------------
      # Push user-service
      # --------------------------------------------------------

      - name: Push user-service to PROD ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: user-service
          image-tag: ${{ inputs.user_service_tag || github.sha }}
          environment-tag: prod
          ecr-repository: prod
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


      # --------------------------------------------------------
      # Push order-service
      # --------------------------------------------------------

      - name: Push order-service to PROD ECR
        uses: ./.github/actions/push-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          service-name: order-service
          image-tag: ${{ inputs.order_service_tag || github.sha }}
          environment-tag: prod
          ecr-repository: prod
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}


  # ============================================================
  # 5. TERRAFORM PLAN
  #
  # NO APPROVAL
  # ============================================================

  terraform-plan:
    name: Terraform Plan

    if: ${{ inputs.deploy_infrastructure }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Terraform Plan
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ inputs.environment }}
          terraform-dir: terraform/environments
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          state-key: microservices/${{ inputs.environment }}/terraform.tfstate
          state-lock-table: ${{ vars.TERRAFORM_LOCK_TABLE }}
          action: plan


  # ============================================================
  # 6. TERRAFORM APPLY
  #
  # DEV  -> DEV approval
  # PROD -> PROD approval
  # ============================================================

  terraform-apply:
    name: Terraform Apply

    needs:
      - terraform-plan

    if: >-
      ${{ inputs.deploy_infrastructure &&
      inputs.terraform_action == 'apply' &&
      needs.terraform-plan.result == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Terraform Apply
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ inputs.environment }}
          terraform-dir: terraform/environments
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          state-key: microservices/${{ inputs.environment }}/terraform.tfstate
          state-lock-table: ${{ vars.TERRAFORM_LOCK_TABLE }}
          action: apply


  # ============================================================
  # 7. TERRAFORM DESTROY
  #
  # DEV  -> DEV approval
  # PROD -> PROD approval
  #
  # No application deployment after destroy.
  # ============================================================

  terraform-destroy:
    name: Terraform Destroy

    if: >-
      ${{ inputs.deploy_infrastructure &&
      inputs.terraform_action == 'destroy' }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Terraform Destroy
        uses: ./.github/actions/deploy-infrastructure
        with:
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          environment: ${{ inputs.environment }}
          terraform-dir: terraform/environments
          tfvars-file: terraform.tfvars
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          state-key: microservices/${{ inputs.environment }}/terraform.tfstate
          state-lock-table: ${{ vars.TERRAFORM_LOCK_TABLE }}
          action: destroy


  # ============================================================
  # 8. DEPLOY DEV
  #
  # NO APPROVAL
  # ============================================================

  deploy-dev:
    name: Deploy Application - DEV

    needs:
      - build-dev
      - push-dev
      - terraform-apply

    if: >-
      ${{ inputs.environment == 'dev' &&
      inputs.deploy_application &&
      inputs.terraform_action != 'destroy' &&
      (needs.build-dev.result == 'success' || needs.build-dev.result == 'skipped') &&
      (needs.push-dev.result == 'success' || needs.push-dev.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Deploy to DEV EKS
        uses: ./.github/actions/deploy-application
        with:
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: microservices-dev-eks
          environment: dev
          helm-chart-path: ./helm
          helm-release-name: microservices-app
          helm-namespace: default
          helm-values-file: helm/values-dev.yaml
          user-service-image-tag: ${{ inputs.user_service_tag || github.sha }}
          order-service-image-tag: ${{ inputs.order_service_tag || github.sha }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          helm-timeout: 10m
          wait-for-rollout: true


  # ============================================================
  # 9. DEPLOY PROD
  #
  # PROD approval required.
  # ============================================================

  deploy-prod:
    name: Deploy Application - PROD

    needs:
      - build-prod
      - push-prod
      - terraform-apply

    if: >-
      ${{ inputs.environment == 'prod' &&
      inputs.deploy_application &&
      inputs.terraform_action != 'destroy' &&
      (needs.build-prod.result == 'success' || needs.build-prod.result == 'skipped') &&
      (needs.push-prod.result == 'success' || needs.push-prod.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') }}

    runs-on: ubuntu-latest

    environment:
      name: prod

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Deploy to PROD EKS
        uses: ./.github/actions/deploy-application
        with:
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: microservices-prod-eks
          environment: prod
          helm-chart-path: ./helm
          helm-release-name: microservices-app
          helm-namespace: default
          helm-values-file: helm/values-prod.yaml
          user-service-image-tag: ${{ inputs.user_service_tag || github.sha }}
          order-service-image-tag: ${{ inputs.order_service_tag || github.sha }}
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          helm-timeout: 10m
          wait-for-rollout: true